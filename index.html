<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 앱">
<meta name="theme-color" content="#f7f4fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%23f7f4fb'/%3E%3Ccircle cx='70' cy='78' r='16' fill='%23ff9ec7'/%3E%3Ccircle cx='112' cy='102' r='16' fill='%23b6a4f7'/%3E%3C/svg%3E">
<title>우리 앱 둘</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    background:linear-gradient(170deg,#fdf6fb 0%,#f4f1fd 48%,#eef4fb 100%);
    color:#3d3350;
    padding:calc(env(safe-area-inset-top,0px) + 34px) 20px calc(env(safe-area-inset-bottom,0px) + 34px);
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:480px}
  h1{font-size:26px;line-height:1.25;margin:0 0 6px;letter-spacing:-.02em}
  .sub{margin:0 0 24px;font-size:14px;color:#8b83a3}
  a.card{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    padding:20px;border-radius:22px;margin-bottom:14px;
    box-shadow:0 10px 26px rgba(120,100,160,.14);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  a.card:active{transform:scale(.982);box-shadow:0 4px 12px rgba(120,100,160,.16)}
  .ico{
    flex:0 0 56px;width:56px;height:56px;border-radius:17px;
    display:flex;align-items:center;justify-content:center;font-size:27px;
  }
  .txt{min-width:0}
  .txt b{display:block;font-size:17px;letter-spacing:-.01em}
  .txt small{display:block;margin-top:3px;font-size:12.5px;line-height:1.4;opacity:.82}
  .kids{background:linear-gradient(140deg,#fffdfe,#ffeef6);border:1px solid #ffdcec;color:#6a4a60}
  .kids .ico{background:linear-gradient(140deg,#ffd7e9,#e6dcff)}
  .tesla{background:linear-gradient(140deg,#15181d,#1b1f25);border:1px solid rgba(255,255,255,.12);color:#f2f4f6}
  .tesla .ico{background:rgba(227,25,55,.16);border:1px solid rgba(227,25,55,.3)}
  .tesla small{color:#a9b1bb;opacity:1}
  .note{margin-top:22px;font-size:12.5px;line-height:1.6;color:#8b83a3;text-align:center}
  .note b{color:#6a5f8a}
</style>
</head>
<body>
<div class="wrap">
  <h1>오늘 쓸 앱 둘 💫</h1>
  <p class="sub">홈 화면에 추가하면 앱처럼 열려요</p>

  <a class="card kids" href="./kids-todo/">
    <span class="ico" aria-hidden="true">👑</span>
    <span class="txt">
      <b>하린이의 투두리스트</b>
      <small>아가 하루 루틴 체크 · 하트 보석 모으기</small>
    </span>
  </a>

  <a class="card tesla" href="./tesla-checklist/">
    <span class="ico" aria-hidden="true">🚗</span>
    <span class="txt">
      <b>인도 검수 체크리스트</b>
      <small>Tesla Model 3 · 롱레인지 · 현장 40분용</small>
    </span>
  </a>

  <p class="note">공유 버튼 <b>⬆️</b> → <b>홈 화면에 추가</b></p>
</div>
</body>
</html>
